name: Backend CI
on:
  push:
  pull_request:
jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test (PostgreSQL started through Testcontainers)
        run: chmod +x mvnw && ./mvnw -ntp --batch-mode -Pprod verify
